name: Continuous Integration

on:
  push:
    tags:       [ v*.*.* ]
    branches:   [ main ]
  pull_request:
    branches:   [ main ]

jobs:
  build:
    name: Build container image
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      with:
        platforms:  "linux/amd64"

    - name: Login to container registry
      if:   ${{ github.event_name != 'pull_request' }}
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Determine latest semver tag
      id:   latest
      run: |
        echo "version=$(git tag | sort -V | tail -n 1)" >> "$GITHUB_OUTPUT"

    - name: Get tagging metadata
      id:   meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository }}
        flavor:
          latest=false
        tags: |
          type=edge
          type=raw,value=latest,enable=${{ github.ref_type == 'tag' && github.ref_name == steps.latest.outputs.version }}
          type=semver,pattern={{version}}
          type=ref,event=branch,enable=${{ github.ref_name != 'main' }}
          type=ref,event=pr
        labels:
          org.opencontainers.image.source=${{ env.GITHUB_SERVER_URL }}/${{ env.GITHUB_REPOSITORY }}

    - name: Build and push container image
      uses: docker/build-push-action@v6
      with:
        platforms:  "linux/amd64"
        provenance: false
        context:    .
        tags:       ${{ steps.meta.outputs.tags }}
        labels:     ${{ steps.meta.outputs.labels }}
        push:       ${{ github.event_name != 'pull_request' }}
        cache-from: type=gha
        cache-to:   type=gha,mode=max

    - name: Output tags
      if: inputs.push
      run: 'echo "::notice::Tags pushed: ${{ steps.meta.outputs.tags }}"'
