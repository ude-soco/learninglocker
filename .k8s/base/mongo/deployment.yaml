apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
spec:
  replicas: 1
  strategy:
    type: Recreate
  template:
    metadata:
    spec:
      containers:
        - name: mongo
          image: mongo
          command:
          - mongod
          args:
            - --wiredTigerCacheSizeGB
            - "0.25"
            - --quiet
            - --logpath
            - /dev/null
          ports:
          - containerPort: 27017
            protocol: TCP
          volumeMounts:
          - mountPath: /data/db
            name: mongo
      volumes:
        - name: mongo
          persistentVolumeClaim:
            claimName: mongo
