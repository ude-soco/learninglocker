apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    maxUnavailable: 50%
    maxSurge: 100%
  template:
    spec:
      containers:
      - name: ui
        image: learninglocker
        args:
        - ui
        envFrom:
        - configMapRef:
            name: learninglocker-config
        - secretRef:
            name: learninglocker-secret
        env:
        - name: REDIS_HOST
          value: $(LEARNINGLOCKER_REDIS_SERVICE)
        - name: MONGO_HOST
          value: $(LEARNINGLOCKER_MONGO_SERVICE)
        ports:
        - containerPort: 3000
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 30