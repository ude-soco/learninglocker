apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
spec:
  replicas: 1
  template:
    spec:
      containers:
      - name: ui
        image: learninglocker
        args:
        - ui
        envFrom:
        - configMapRef:
            name: config
        - secretRef:
            name: secret
        env:
        - name: REDIS_HOST
          value: $(REDIS_SERVICE)
        - name: MONGO_HOST
          value: $(MONGO_SERVICE)
        ports:
        - containerPort: 3000
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 30