name: learninglocker

x-common: &common
  build: .
  image: ${IMAGE_NAME_PREFIX:-ghcr.io/ude-soco/}learninglocker:${IMAGE_TAG:-latest}
  restart: always
  depends_on:
    mongo:
      condition: service_healthy
    redis:
      condition: service_healthy
  develop:
    watch:
    - path: package.json
      action: rebuild
    - path: Dockerfile
      action: rebuild
    - path: /lib
      action: rebuild
  environment:
    QUEUE_PROVIDER: REDIS
    MONGODB_PATH: mongodb://mongo:27017/learninglocker_v2
    REDIS_HOST: redis
    UI_HOST: ui
    UI_PORT: 3000
    API_HOST: api
    API_PORT: 8080
    SITE_URL: http://127.0.0.1
    LOG_MIN_LEVEL: warning
    # SMTP_HOST
    # SMTP_PORT
    # SMTP_SECURED
    # SMTP_USER
    # SMTP_PASS
    APP_SECRET: "i-am-not-secure-please-change-me"

services:
  api:
    <<: *common
    command: [ "node", "api/dist/server" ]
    ports: [ "8080:8080" ]
    develop:
      watch:
      - path: /api
        action: rebuild

  ui:
    <<: *common
    command: [ "node", "ui/dist/server" ]
    ports: [ "3000:3000" ]
    develop:
      watch:
      - path: /ui
        action: rebuild

  worker:
    <<: *common
    command: [ "node", "worker/dist/server" ]
    develop:
      watch:
      - path: /worker
        action: rebuild

  cli:
    <<: *common
    profiles: [ halted ]
    develop:
      watch:
      - path: /cli
        action: rebuild
    depends_on:
    - mongo

  mongo:
    image: mongo:6.0
    command: mongod --wiredTigerCacheSizeGB 0.25 --quiet --logpath /dev/null
    ports: [ "27017:27017" ]
    volumes:
    - mongo:/data/db
    restart: always
    healthcheck:
      test: "mongosh --nodb --eval 'disableTelemetry()'; echo 'db.runCommand({ping: 1}).ok' | mongosh localhost:27017/test --quiet"
      start_period: 2s
      interval: 10s

  redis:
    image: redis:7
    command: --loglevel warning
    volumes:
    - redis:/data
    ports: [ "6379:6379" ]
    healthcheck:
      test: ["CMD", "redis-cli","ping"]
      start_period: 2s
      interval: 10s

volumes:
  mongo:
  redis:
